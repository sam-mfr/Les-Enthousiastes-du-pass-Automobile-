<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Mon espace</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Mon espace membre</div><div class="sub">Consultation uniquement</div></div></header><main id="app"></main><script src="app.js"></script><script>
if(!guard()){}else{let d=data(),s=current(),m=d.members.find(x=>x.id===s.memberId);if(!m){logout()}else{let cars=m.cars.map(c=>`<div class="card"><img class="carphoto" src="${c.photo||''}" ${c.photo?'':'style="display:none"'}><h3>${esc(c.brand)} ${esc(c.model)}</h3><p>${esc(c.year||'')} · ${esc(c.engine||'')}</p></div>`).join('');app.innerHTML=shell('Mon espace','espace.html',`<div class="card"><div class="eyebrow">Bienvenue</div><h2>${esc(m.firstName)} ${esc(m.lastName)}</h2><div class="grid"><div><img class="avatar" src="${m.photo||''}" ${m.photo?'':'style="display:none"'}><p>📍 ${esc(m.city||'')}</p></div><div><p>✉️ ${esc(m.email)}</p><p>📞 ${esc(m.phone||'')}</p><span class="pill">👤 Membre</span>${s.admin?'<span class="pill">🔐 Administrateur</span>':''}</div></div></div><div><h2>Mes voitures</h2>${cars||'<div class="card muted">Aucune voiture renseignée.</div>'}</div><div class="card"><h2>Sorties & road-books</h2><p>Consultez les balades et road-books publiés par le club.</p><a class="btn" href="balades.html">🗺️ Voir les balades</a> <a class="btn alt" href="roadbook.html">📖 Voir les road-books</a></div>`,!!s.admin)}}}
</script></body></html>
