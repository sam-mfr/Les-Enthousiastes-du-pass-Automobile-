<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Balades</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Balades</div><div class="sub">Sorties du club</div></div></header><main id="app"></main><script src="app.js"></script><script>
if(guard()){let d=data(),s=current();let cards=d.routes.map(r=>`<div class="card"><div class="eyebrow">Sortie</div><h2>${esc(r.name)}</h2><p>${esc(r.date||'')} · ${esc(r.start||'')} · ${esc(r.distance||'')}</p><p>${esc(r.desc||'')}</p><a class="btn" href="roadbook.html?route=${encodeURIComponent(r.id)}">📖 Road-book</a></div>`).join('');app.innerHTML=shell('Balades','balades.html',cards||'<div class="card"><h2>Aucune balade publiée</h2><p class="muted">Les prochaines sorties apparaîtront ici lorsqu’un administrateur les aura créées.</p></div>',!!s.admin)}
</script></body></html>
