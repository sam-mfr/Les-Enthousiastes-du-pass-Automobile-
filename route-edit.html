<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Créer un road-book</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Balade / Road-book</div><div class="sub">Administration</div></div></header><main id="app"></main><script src="app.js"></script><script>
if(guard(true)){let d=data(),id=new URLSearchParams(location.search).get('id'),r=d.routes.find(x=>x.id===id)||{id:crypto.randomUUID(),name:'',date:'',start:'',distance:'',desc:'',steps:[]};app.innerHTML=shell('Éditeur','admin.html',`<div class="card"><div class="eyebrow">Création</div><h2>Balade et road-book</h2><label>Nom</label><input id="n" value="${esc(r.name)}"><div class="grid"><div><label>Date</label><input id="dt" value="${esc(r.date)}"></div><div><label>Départ</label><input id="st" value="${esc(r.start)}"></div></div><label>Distance</label><input id="di" value="${esc(r.distance)}"><label>Description</label><textarea id="de">${esc(r.desc)}</textarea></div><div class="card"><h2>Étapes</h2><div id="steps"></div><button onclick="addStep()">➕ Ajouter une étape</button></div><div class="card"><button class="gold" onclick="saveRoute()">💾 Enregistrer / publier</button> <a class="btn alt" href="admin.html">Annuler</a></div>`);let steps=structuredClone(r.steps);function renderSteps(){stepsEl.innerHTML=steps.map((x,i)=>`<div class="card"><label>Étape ${i+1} — titre</label><input value="${esc(x.title)}" oninput="steps[${i}].title=this.value"><label>Instructions</label><textarea oninput="steps[${i}].text=this.value">${esc(x.text)}</textarea><label>Photo / illustration de l'étape</label><input type="file" accept="image/*" onchange="sp(${i},this)"><img class="carphoto" src="${x.photo||''}" ${x.photo?'':'style="display:none"'}><button class="danger" onclick="steps.splice(${i},1);renderSteps()">🗑️ Supprimer</button></div>`).join('')||'<p class="muted">Aucune étape.</p>'}let stepsEl=document.getElementById('steps');window.sp=(i,input)=>readImg(input,x=>{steps[i].photo=x;renderSteps()});window.addStep=()=>{steps.push({title:'',text:'',photo:''});renderSteps()};function saveRoute(){let obj={id,name:n.value,date:dt.value,start:st.value,distance:di.value,desc:de.value,steps};let ix=d.routes.findIndex(x=>x.id===id);if(ix<0)d.routes.push(obj);else d.routes[ix]=obj;save(d);location.href='admin.html'}renderSteps()}
</script></body></html>
