<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Road-book</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Road-book</div><div class="sub">Navigation par étapes</div></div></header><main id="app"></main><script src="app.js"></script><script>
if(guard()){let d=data(),s=current(),rid=new URLSearchParams(location.search).get('route'),r=d.routes.find(x=>x.id===rid)||d.routes[0];let body=r?`<div class="card"><div class="eyebrow">Road-book</div><h2>${esc(r.name)}</h2><p>${esc(r.date||'')} · ${esc(r.start||'')} · ${esc(r.distance||'')}</p><div id="step"></div><div class="grid"><button onclick="prev()">← Précédente</button><button onclick="next()">Suivante →</button></div></div>`:'<div class="card"><h2>Aucun road-book publié</h2><p class="muted">Les road-books créés par les administrateurs apparaîtront ici.</p></div>';app.innerHTML=shell('Road-book','roadbook.html',body,!!s.admin);if(r){let i=0;window.render=()=>{let z=r.steps[i];step.innerHTML=`<div class="notice"><b>Étape ${i+1} / ${r.steps.length}</b><h3>${esc(z.title)}</h3><p>${esc(z.text)}</p>${z.photo?`<img class="carphoto" src="${z.photo}">`:''}</div>`};window.next=()=>{if(i<r.steps.length-1)i++;render()};window.prev=()=>{if(i>0)i--;render()};render()}}
</script></body></html>
