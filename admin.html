<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Administration</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Administration</div><div class="sub">Gestion complète du club</div></div></header><main id="app"></main><script src="app.js"></script><script>
let d=data(),s=current();
if(s&&s.admin){renderAdmin()}else if(!d.members.some(x=>x.admin)){app.innerHTML=shell('Première configuration','admin.html',`<div class="card"><div class="eyebrow">Première installation</div><h2>Créer le premier administrateur</h2><p class="muted">Aucun compte n’existe encore. Cette étape ne crée aucun exemple : elle initialise votre propre compte administrateur.</p><div class="grid"><div><label>Prénom</label><input id="fn"><label>Nom</label><input id="ln"><label>Email</label><input id="em" type="email"></div><div><label>Code membre (4–6 chiffres)</label><input id="pn" inputmode="numeric" maxlength="6"><label>Téléphone</label><input id="ph"></div></div><button class="gold" onclick="firstAdmin()">Créer l’administrateur</button><p id="msg" class="muted"></p></div>`)}else{location.href='acces.html'}
function firstAdmin(){let d=data();if(!em.value||pn.value.length<4){msg.textContent='Renseignez un email et un code de 4 à 6 chiffres.';return}let m={id:crypto.randomUUID(),firstName:fn.value,lastName:ln.value,email:em.value.toLowerCase(),pin:pn.value,phone:ph.value,city:'',admin:true,cars:[]};d.members.push(m);save(d);setSession({memberId:m.id,admin:true});location.reload()}
function renderAdmin(){d=data();let members=d.members.map(m=>`<div class="memberrow"><img class="avatar" src="${m.photo||''}" ${m.photo?'':'style="display:none"'}><div><b>${esc(m.firstName)} ${esc(m.lastName)}</b><div class="muted">${esc(m.email)} · ${m.cars.length} voiture(s)</div>${m.admin?'<span class="pill">🔐 Admin</span>':'<span class="pill">👤 Membre</span>'}</div><div><button class="alt" onclick="editMember('${m.id}')">Modifier</button> <button class="danger" onclick="delMember('${m.id}')">Supprimer</button></div></div>`).join('');let routes=d.routes.map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="muted">${esc(r.date||'')} · ${esc(r.distance||'')} · ${r.steps.length} étape(s)</div><button class="alt" onclick="editRoute('${r.id}')">Modifier</button> <button class="danger" onclick="delRoute('${r.id}')">Supprimer</button></div>`).join('');app.innerHTML=shell('Administration','admin.html',`<div class="card"><div class="eyebrow">Tableau de bord</div><h2>Gestion du club</h2><div class="grid3"><div class="notice"><b>${d.members.length}</b><br>membre(s)</div><div class="notice"><b>${d.members.reduce((n,m)=>n+m.cars.length,0)}</b><br>voiture(s)</div><div class="notice"><b>${d.routes.length}</b><br>road-book(s)</div></div></div><div class="card"><h2>👥 Membres</h2><button class="gold" onclick="newMember()">➕ Créer un membre</button><div>${members||'<p class="muted">Aucun membre.</p>'}</div></div><div class="card"><h2>🗺️ Road-books & balades</h2><button class="gold" onclick="newRoute()">➕ Créer une balade / road-book</button>${routes||'<p class="muted">Aucun historique ou exemple : créez votre première sortie.</p>'}</div><div class="card"><h2>⚙️ Paramètres</h2><label>Nom du club</label><input id="club" value="${esc(d.settings.club)}"><label>Ville / secteur</label><input id="city" value="${esc(d.settings.city)}"><label>Texte d’accueil</label><input id="welcome" value="${esc(d.settings.welcome)}"><label>Couleur d’accent</label><input id="accent" type="color" value="${esc(d.settings.accent)}"><button onclick="settingsSave()">💾 Enregistrer</button></div><div class="card"><h2>💾 Sauvegarde</h2><button onclick="exportData()">⬇️ Exporter</button> <button class="alt" onclick="document.getElementById('imp').click()">⬆️ Importer</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importData(this)"></div>`) }
function settingsSave(){d.settings={club:club.value,city:city.value,welcome:welcome.value,accent:accent.value};save(d);alert('Paramètres enregistrés.')}
function newMember(){location.href='member-edit.html'}
function editMember(id){location.href='member-edit.html?id='+id}
function delMember(id){if(confirm('Supprimer ce membre et ses voitures ?')){d.members=d.members.filter(x=>x.id!==id);save(d);renderAdmin()}}
function newRoute(){location.href='route-edit.html'}
function editRoute(id){location.href='route-edit.html?id='+id}
function delRoute(id){if(confirm('Supprimer ce road-book ?')){d.routes=d.routes.filter(x=>x.id!==id);save(d);renderAdmin()}}
function exportData(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='epa-sauvegarde.json';a.click()}
function importData(i){let r=new FileReader();r.onload=()=>{try{localStorage.setItem(K,r.result);location.reload()}catch(e){alert('Fichier invalide')}};r.readAsText(i.files[0])}
</script></body></html>
