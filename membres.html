<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><title>👥 Membres</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Les Enthousiastes du Passé Automobile</div><small>Mulhouse & région · espace membres</small></div></header><main><nav class="nav"><a href="index.html" class="">Accueil</a><a href="membres.html" class="active">👥 Membres</a><a href="balades.html" class="">🗺️ Balades</a><a href="roadbook.html" class="">📖 Road-book</a><a href="rallye.html" class="">🏆 Rallye</a><a href="gestion.html" class="">⚙️ Gestion</a></nav><div class="card"><div class="eyebrow">Vie du club</div><h2>Annuaire des membres</h2><input id="q" placeholder="🔎 Rechercher un membre ou une voiture" oninput="render()"><div id="list"></div></div><div class="card"><h3>Ajouter un membre</h3><input id="n" placeholder="Nom / prénom"><input id="v" placeholder="Ville"><input id="t" placeholder="Téléphone"><input id="e" placeholder="Email"><h3>Première voiture</h3><div class="grid"><input id="b" placeholder="Marque"><input id="m" placeholder="Modèle"><input id="y" placeholder="Année"><input id="en" placeholder="Motorisation"></div><button onclick="add()">Ajouter</button></div><script>let a=JSON.parse(localStorage.epa||'null')||[{name:'Jean Dupont',city:'Mulhouse',phone:'06 00 00 00 00',email:'jean@example.fr',cars:[{brand:'Porsche',model:'911 2.7',year:'1974',engine:'2.7'},{brand:'Peugeot',model:'205 GTI',year:'1988',engine:'1.9'}]}];function render(){let s=q.value.toLowerCase();list.innerHTML=a.filter(x=>(x.name+' '+x.city+' '+x.cars.map(c=>c.brand+' '+c.model)).toLowerCase().includes(s)).map(x=>'<div class="member"><b>'+x.name+'</b><div class="muted">📍 '+x.city+' · 📞 '+x.phone+' · ✉️ '+x.email+'</div>'+x.cars.map(c=>'<div class="car">🚗 <b>'+c.brand+' '+c.model+'</b> · '+c.year+' · '+c.engine+'</div>').join('')+'<span class="badge">'+x.cars.length+' voiture(s)</span></div>').join('')||'<p class="muted">Aucun résultat.</p>'}function add(){a.push({name:n.value||'Membre',city:v.value,phone:t.value,email:e.value,cars:[{brand:b.value,model:m.value,year:y.value,engine:en.value}]});localStorage.epa=JSON.stringify(a);render()}render()</script><footer>Les Enthousiastes du Passé Automobile · Mulhouse</footer></main></body></html>
