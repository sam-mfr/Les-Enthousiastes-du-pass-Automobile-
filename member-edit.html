<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Fiche membre</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Fiche membre</div><div class="sub">Administration</div></div></header><main id="app"></main><script src="app.js"></script><script>
if(guard(true)){let d=data(),id=new URLSearchParams(location.search).get('id'),m=d.members.find(x=>x.id===id)||{id:crypto.randomUUID(),firstName:'',lastName:'',email:'',pin:'',phone:'',city:'',admin:false,cars:[]};let edit=!!id;app.innerHTML=shell('Fiche membre','admin.html',`<div class="card"><div class="eyebrow">${edit?'Modifier':'Nouveau'} membre</div><h2>Informations</h2><div class="grid"><div><label>Prénom</label><input id="fn" value="${esc(m.firstName)}"><label>Nom</label><input id="ln" value="${esc(m.lastName)}"><label>Email</label><input id="em" value="${esc(m.email)}"><label>Téléphone</label><input id="ph" value="${esc(m.phone)}"></div><div><label>Ville</label><input id="ci" value="${esc(m.city)}"><label>Code personnel membre</label><input id="pn" inputmode="numeric" maxlength="6" value="${esc(m.pin)}"><label>Photo du membre</label><input id="mp" type="file" accept="image/*"><img id="prev" class="photo" src="${m.photo||''}" ${m.photo?'':'style="display:none"'}></div></div><label><input id="adm" type="checkbox" ${m.admin?'checked':''} style="width:auto"> Ouvrir les droits administrateur à ce membre</label><p class="muted">⚠️ Un administrateur peut donc attribuer ou retirer le rôle administrateur depuis cette fiche.</p><button class="gold" onclick="saveMember()">💾 Enregistrer la fiche</button> <a class="btn alt" href="admin.html">Annuler</a></div><div class="card"><h2>🚗 Voitures du membre</h2><div id="cars"></div><button onclick="addCar()">➕ Ajouter une voiture</button></div>`);
let photo=m.photo||'';mp.onchange=()=>readImg(mp,x=>{photo=x;prev.src=x;prev.style.display='block'});let cars=structuredClone(m.cars);
function carRender(){carsEl.innerHTML=cars.map((c,i)=>`<div class="card"><div class="grid"><div><label>Marque</label><input value="${esc(c.brand)}" oninput="cars[${i}].brand=this.value"><label>Modèle</label><input value="${esc(c.model)}" oninput="cars[${i}].model=this.value"><label>Année</label><input value="${esc(c.year)}" oninput="cars[${i}].year=this.value"><label>Motorisation</label><input value="${esc(c.engine)}" oninput="cars[${i}].engine=this.value"></div><div><label>Photo de la voiture</label><input type="file" accept="image/*" onchange="carPhoto(${i},this)"><img class="carphoto" src="${c.photo||''}" ${c.photo?'':'style="display:none"'} id="cp${i}"></div></div><button class="danger" onclick="cars.splice(${i},1);carRender()">🗑️ Supprimer cette voiture</button></div>`).join('')||'<p class="muted">Aucune voiture.</p>'}let carsEl=document.getElementById('cars');window.carPhoto=(i,input)=>readImg(input,x=>{cars[i].photo=x;carRender()});window.addCar=()=>{cars.push({brand:'',model:'',year:'',engine:'',photo:''});carRender()};function saveMember(){let obj={...m,firstName:fn.value,lastName:ln.value,email:em.value.toLowerCase(),phone:ph.value,city:ci.value,pin:pn.value,admin:adm.checked,photo,cars};let ix=d.members.findIndex(x=>x.id===obj.id);if(ix<0)d.members.push(obj);else d.members[ix]=obj;save(d);location.href='admin.html'}carRender()}
</script></body></html>
