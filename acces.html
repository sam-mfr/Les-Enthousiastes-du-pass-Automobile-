<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Accès membre</title></head><body><header><img src="logo-club.jpg"><div><div class="brand">Accès membre</div><div class="sub">Consultation uniquement</div></div></header><main>
<div class="card"><div class="eyebrow">Membre</div><h2>Connexion à votre espace</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Code personnel</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"><button onclick="login()">Accéder à mon espace</button><p id="msg" class="muted"></p></div><div class="card"><p class="muted">Le code personnel est créé ou réinitialisé par un administrateur depuis la fiche du membre.</p><a class="btn alt" href="index.html">← Retour</a></div>
<script src="app.js"></script><script>function login(){let d=data(),m=d.members.find(x=>(x.email||'').toLowerCase()==email.value.trim().toLowerCase()&&x.pin==pin.value);if(!m){msg.textContent='Accès refusé. Vérifiez vos identifiants.';return}setSession({memberId:m.id,admin:!!m.admin});location.href='espace.html'}</script></main></body></html>
